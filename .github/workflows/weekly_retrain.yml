name: Weekly model retrain

on:
  schedule:
    - cron: "0 14 * * 1"   # 2 PM UTC every Monday
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild features
        run: python src/features.py

      - name: Retrain model
        run: python src/train.py

      - name: Commit new model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/processed/
          git diff --staged --quiet || git commit -m "auto: weekly retrain $(date +%F)"
          git push